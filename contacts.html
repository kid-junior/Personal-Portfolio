<body>
    <header class="site-header" id="header">
        <img src="assets/images/k.png" alt="Kidus Yosef Logo" class="logo">
        <nav class="main-nav">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="projects.html" class="nav-link">Projects</a></li>
                <li class="nav-item"><a href="about_me.html" class="nav-link">About Me</a></li>
                <li class="nav-item"><a href="contacts.html" class="nav-link active">Contacts</a></li>
            </ul>
        </nav>
        <button id="music-toggle" class="music-button" aria-label="Toggle music">Play Music</button>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>
    <audio id="bg-music" loop src="assets/audio/moog_city_2.mp3"></audio>
    <main class="site-main">
        <section id="contacts" class="contact-section glass">
            <h2 class="section-title">Get in Touch!</h2>
            <article class="info-desc">
                <p class="paragraph-desc">Interested in working together or discussing a project?</p>
                <p class="paragraph-desc">Feel free to reach out — I’m always open to new ideas and collaborations.</p>
            </article>
            <div class="contact-container">
                <div class="contact-info glass">
                    <h3 class="info-title">Based In</h3>
                    <p class="info-desc">Ethiopia <img src="assets/images/ethiopia.png" alt="Ethiopia Flag" class="country-icon"></p> 
                    <h3 class="info-title">Connect with me on: </h3>
                    <div class="social-links">
                        <a href="https://github.com/kid-junior" class="social-link github"><i class="fab fa-github"></i></a>
                        <a href="https://www.linkedin.com/in/kidus-yosef-364a29332" class="social-link linkedin"><i class="fab fa-linkedin"></i></a>
                        <a href="https://www.upwork.com/freelancers/~01c59803c8b7122263?mp_source=share" class="social-link upwork"><i class="fa-brands fa-upwork"></i></a>
                    </div>
                </div>
                <form action="https://formspree.io/f/xgovwdqd" method="post" id="contact-form" class="contact-form glass">
                    <div class="form-field">
                        <label for="fname">Full Name: </label>
                        <input type="text" name="fname" id="fname" placeholder="Full Name" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Email: </label>
                        <input type="email" name="email" id="email" pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" placeholder="your@email.com" required>
                    </div>
                    <div class="form-field">
                        <label for="message">Message: </label>
                        <textarea name="message" id="message" placeholder="Your Message" required></textarea>
                    </div>
                    <div class="form-field">
                        <button type="submit" class="submit-btn btn">
                            Send Message
                            <dotlottie-player id="submit-lottie" src="https://lottie.host/32536b81-bafb-4a5d-a010-a0efad4e0c3d/UDWwLgOtnT.lottie" background="transparent" speed="1" style="width: 25px; height: 25px;" loop></dotlottie-player>
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer class="site-footer glass" id="footer">
